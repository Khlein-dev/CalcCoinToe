<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel=icon href="cct.png" type="image/x-icon">

    <link rel="stylesheet" href="CalcCoinToe.css">


</head>

<body>

    <center>

        <div class="container">

            <img src="cct.png" alt="">

            <button id="f1" onclick="cal()"> calculate


            </button>

            <button id="f2" onclick="con()"> convert


            </button>

            <button id="f3" onclick="tik()"> tic tac toe


            </button>



        </div>
    </center>


    <div class="calculate">
        <h1>CALCULATOR</h1>
        <button class="exit exitCalc">X</button>

        <div class="CalcContainer">
            <input type="text" id="display" disabled style="height: 200px;">
            <div class="buttons">
                <button onclick="clearDisplay()">C</button>
                <button onclick="appendToDisplay('7')">7</button>
                <button onclick="appendToDisplay('8')">8</button>
                <button onclick="appendToDisplay('9')">9</button>
                <button onclick="appendToDisplay('/')">/</button>
                <button onclick="appendToDisplay('4')">4</button>
                <button onclick="appendToDisplay('5')">5</button>
                <button onclick="appendToDisplay('6')">6</button>
                <button onclick="appendToDisplay('*')">*</button>
                <button onclick="appendToDisplay('1')">1</button>
                <button onclick="appendToDisplay('2')">2</button>
                <button onclick="appendToDisplay('3')">3</button>
                <button onclick="appendToDisplay('-')">-</button>
                <button onclick="appendToDisplay('0')">0</button>
                <button onclick="calculateResult()">=</button>
                <button onclick="appendToDisplay('+')">+</button>
            </div>

        </div>


    </div>

    <div class="convert">
        <h1>CONVERT</h1>
        <button class="exit exitCon">X</button>

    </div>

    <div class="tictac">
        <h1>TIC TAC TOE</h1>
        <button class="exit exitTic">X</button>

    </div>

    <script src="CalcCoinToe.js"></script>


</body>

</html>
