<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalcCoinToe</title>
    <link rel=icon href="cct.png" type="image/x-icon">

    <link rel="stylesheet" href="CalcCoinToe.css">


</head>

<body>

    <center>

        <div class="container">

            <img src="cct.png" alt="">

            <button id="f1" onclick="cal()"> calculate


            </button>

            <button id="f2" onclick="con()"> convert


            </button>

            <button id="f3" onclick="tik()"> tic tac toe


            </button>



        </div>
    </center>


    <div class="calculate">
        <h1>CALCULATOR</h1>
        <button class="exit exitCalc">X</button>

        <div class="CalcContainer">
            <center>
                <input type="text" id="display" disabled placeholder="0" class="screen">

                <div class="buttons">
                    <button onclick="appendToDisplay('7')" class="numbers">7</button>
                    <button onclick="appendToDisplay('8')" class="numbers">8</button>
                    <button onclick="appendToDisplay('9')" class="numbers">9</button>
                    <button onclick="deleteLast()" class="operators">DE</button>
                    <button onclick="clearDisplay()" class="operators">CE</button>
                    <button onclick="appendToDisplay('4')" class="numbers">4</button>
                    <button onclick="appendToDisplay('5')" class="numbers">5</button>
                    <button onclick="appendToDisplay('6')" class="numbers">6</button>
                    <button onclick="appendToDisplay('*')" class="operators">*</button>
                    <button onclick="appendToDisplay('-')" class="operators">-</button>
                    <button onclick="appendToDisplay('1')" class="numbers">1</button>
                    <button onclick="appendToDisplay('2')" class="numbers">2</button>
                    <button onclick="appendToDisplay('3')" class="numbers">3</button>
                    <button onclick="appendToDisplay('+')" class="operators">+</button>
                    <button onclick="appendToDisplay('/')" class="operators">/</button>
                    <button onclick="appendToDisplay('0')" class="numbers">0</button>
                    <button onclick="appendToDisplay('00')" class="numbers">00</button>
                    <button onclick="appendToDisplay('.')" class="numbers">.</button>
                    <button onclick="calculateResult()" class="equals" style="width: 200px;">=</button>

                </div>
            </center>

        </div>


    </div>

    <div class="convert">
        <h1>CONVERT</h1>
        <button class="exit exitCon">X</button>
        <center>
            <div class="ConContainer">
                <input type="number" id="amount" placeholder="Enter amount">

                <div class="selectors">
                    <select id="fromCurrency">
                        <option value="USD">🇺🇸 USD</option>
                        <option value="PHP">🇵🇭 PHP</option>
                        <option value="JPY">🇯🇵 JPY</option>
                        <option value="EUR">🇪🇺 EUR</option>
                        <option value="GBP">🇬🇧 GBP</option>
                        <option value="KRW">🇰🇷 KRW</option>
                    </select>

                    <span>→</span>

                    <select id="toCurrency">
                        <option value="USD">🇺🇸 USD</option>
                        <option value="PHP">🇵🇭 PHP</option>
                        <option value="JPY">🇯🇵 JPY</option>
                        <option value="EUR">🇪🇺 EUR</option>
                        <option value="GBP">🇬🇧 GBP</option>
                        <option value="KRW">🇰🇷 KRW</option>
                    </select>
                </div>

                <button onclick="convertCurrency()" id="resultCurrency">Convert</button>
                <div id="result"></div>
            </div>
        </center>

    </div>

    <div class="tictac">
        <h1>TIC TAC TOE</h1>
        <button class="exit exitTic">X</button>
        <div class="ticContainer">
            <center>
                <div class="grid">
                    <div class="cell" onclick="makeMove(0)"></div>
                    <div class="cell" onclick="makeMove(1)"></div>
                    <div class="cell" onclick="makeMove(2)"></div>
                    <div class="cell" onclick="makeMove(3)"></div>
                    <div class="cell" onclick="makeMove(4)"></div>
                    <div class="cell" onclick="makeMove(5)"></div>
                    <div class="cell" onclick="makeMove(6)"></div>
                    <div class="cell" onclick="makeMove(7)"></div>
                    <div class="cell" onclick="makeMove(8)"></div>
                </div>
                <button id="resetButton" onclick="resetGame()">Reset</button>
                <h2 id="statusMessage">Player X's turn</h2>
            </center>
        </div>

    </div>

    <script src="CalcCoinToe.js"></script>


</body>

</html>
