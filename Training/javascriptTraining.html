<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Training</title>
    <script>
        function lightmode() {
            const body = document.body;
            
            if (body.style.backgroundColor === "black") {
                // Switch to Light Mode
                body.style.backgroundColor = "white";
                body.style.color = "black";
                button.textContent = "CHANGE TO DARK MODE";
                
            } else {
                // Switch to Dark Mode
                body.style.backgroundColor = "black";
                body.style.color = "antiquewhite";
                button.textContent = "CHANGE TO LIGHT MODE";
                
            }
        }

        function showname(){
            const yourName = document.getElementById('name').value;
            const message = document.getElementsByClassName('message')[0];

            message.textContent  =`Hello, ${yourName} Welcome to my Javascript Training!`;
        }

        function calculate(){
            const n1 = document.getElementById('num1').value;
            const n2 = document.getElementById('num2').value;
            const result = document.getElementsByClassName('result')[0];

            const add = n1 + n2;
            const subt = n1 - n2;
            const multip = n1 * n2;
            const div = n1 / n2;

            result.textContent =`Addition: ${add} Subtraction: ${subt} Multiplication: ${multip} Division:${div} `;
        }


    </script>
</head>

<body style="background-color: black; color: antiquewhite; margin: 50px; justify-content: center; transition: 300ms; gap: 15px;">
    <button id="togglebtn" onclick="lightmode()" style="width: 200px; height: 50px; border-radius: 15px; background-color: aquamarine;">CHANGE TO LIGHT MODE</button>

    <input type="text" id="name" placeholder="Enter your Name:" style="width: 200px; height: 30px;">
    <button onclick="showname()">ENTER</button>
    <div class="message">

    </div>

    <br>
    
    <input type="number" id="num1" placeholder="Enter number 1:" style="width: 200px; height: 30px; background-color: #b0d85e;">
    <input type="number"  id="num2"  placeholder="Enter number 2:" style="width: 200px; height: 30px;background-color: #b0d85e;" >
    <button onclick="calculate()">CALCULATE</button>
    <p class="result"></p>
</body>

</html>
