<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Training</title>
    <script>
        function lightmode() {
            const body = document.body;

            if (body.style.backgroundColor === "black") {
                // Switch to Light Mode
                body.style.backgroundColor = "white";
                body.style.color = "black";
                button.textContent = "CHANGE TO DARK MODE";

            } else {
                // Switch to Dark Mode
                body.style.backgroundColor = "black";
                body.style.color = "antiquewhite";
                button.textContent = "CHANGE TO LIGHT MODE";

            }
        }

        function showname() {
            const yourName = document.getElementById('name').value;
            const message = document.getElementsByClassName('message')[0];

            message.textContent = `Hello, ${yourName} Welcome to my Javascript Training!`;
        }

        function calculate() {
            const n1 = parseFloat(document.getElementById('num1').value);
            const n2 = parseFloat(document.getElementById('num2').value);
            const result = document.getElementsByClassName('result')[0];

            const add = n1 + n2;
            const subt = n1 - n2;
            const multip = n1 * n2;
            const div = n1 / n2;

            result.textContent = `Addition: ${add} Subtraction: ${subt} Multiplication: ${multip} Division:${div} `;
        }

        function clearNum() {
            document.getElementById('num1').value = "";
            document.getElementById('num2').value = "";
            document.getElementsByClassName('result')[0].textContent = "";
        }


    </script>
</head>

<body
    style="background-color: black; color: antiquewhite; margin: 50px; justify-content: center; transition: 300ms; gap: 15px;">
    <button id="togglebtn" onclick="lightmode()"
        style="width: 200px; height: 50px; border-radius: 15px; background-color: aquamarine;">CHANGE TO LIGHT
        MODE</button>

    <input type="text" id="name" placeholder="Enter your Name:" style="width: 200px; height: 30px;">
    <button onclick="showname()">ENTER</button>
    <div class="message">

    </div>

    <br>

    <input type="number" id="num1" placeholder="Enter number 1:"
        style="width: 200px; height: 30px; background-color: #b0d85e;">
    <input type="number" id="num2" placeholder="Enter number 2:"
        style="width: 200px; height: 30px;background-color: #b0d85e;">
    <button onclick="calculate()">CALCULATE</button>
    <p class="result"></p>

    <button onclick="clearNum()"> CLEAR</button>

    <br>

    <div class="payroll">

        <center>
            <H1>SIMPLE PAYROLL</H1>
            <input type="text" id="employee" placeholder="Employee Name">
            <input type="number" id="rate" placeholder="Hourly Rate">
            <input type="number" id="hour" placeholder="Hours Worked">
            <button onclick="payroll()">CALCULATE WAGE!</button>
            <button onclick="clearPay()">CLEAR</button>

            <h5 class="salary" id="sal"></h5>
        </center>
    </div>

    <script>
        function payroll() {
            const employee = document.getElementById('employee').value;
            const rate = parseFloat(document.getElementById('rate').value);
            const hour = parseFloat(document.getElementById('hour').value);
            const salary = document.getElementsByClassName('salary')[0];
            const pay = rate * hour;
            if (!employee || !rate || !hour) {
                salary.textContent = 'Please Enter the following';
            } else {
                salary.textContent = `${employee}'s salary is ${pay} pesos`;
            }
        }

        function clearPay() {
            document.getElementById('employee').value = "";
            document.getElementById('rate').value = "";
            document.getElementById('hour').value = "";
            document.getElementsByClassName('salary')[0].textContent = "";
        }
    </script>

    <style>
        .payroll {
            width: 400px;
            height: 400px;
            border-radius: 10px;
            background: linear-gradient(45deg, #6f196f, #411741);
            color: antiquewhite;
            display: flex;
            flex-direction: column;
            justify-content: center;
            justify-items: center;
            gap: 10px;
        }

        .payroll input {
            width: 200px;
            height: 30px;
            border-radius: 8px;
            background-color: #b0d85e;
            margin-bottom: 10px;
        }

        .payroll button {
            width: 200px;
            height: 30px;
            border-radius: 8px;
            background-color: #caac25;
            transition: 400ms ease-in-out;
        }

        .payroll button:hover {
            transform: translateY(-10px);
        }

        .salary {
            color: antiquewhite;
            font-size: 20px;
            font-weight: 500;
        }

        placeholder {
            color: black;
        }
    </style>

</body>

</html>
